name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: |
          cp android-setup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/vhs/attendance
          cp android-setup/java/com/vhs/attendance/MainActivity.java android/app/src/main/java/com/vhs/attendance/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cp android-setup/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
